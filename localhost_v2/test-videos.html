<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEST — Toutes les Vidéos | Expert Suisse</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@300;400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  
  :root {
    --cream: #f5f0e8;
    --gold: #c8a96e;
    --dark: #0f0f0f;
    --text: #2a2a2a;
  }

  body {
    background: var(--dark);
    color: var(--cream);
    font-family: 'Montserrat', sans-serif;
    min-height: 100vh;
  }

  header {
    padding: 3rem 4rem 2rem;
    border-bottom: 1px solid rgba(200,169,110,0.3);
    display: flex;
    align-items: center;
    gap: 1.5rem;
  }

  header .back {
    color: var(--gold);
    text-decoration: none;
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: 0.7;
    transition: opacity 0.2s;
  }
  header .back:hover { opacity: 1; }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 300;
    font-size: 1.8rem;
    color: var(--cream);
  }

  header .count {
    margin-left: auto;
    font-size: 0.7rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0.8;
  }

  main {
    padding: 4rem;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(520px, 1fr));
    gap: 4rem;
  }

  .video-card {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .video-wrap {
    position: relative;
    background: #000;
    border: 1px solid rgba(200,169,110,0.15);
    overflow: hidden;
  }

  .video-wrap video {
    width: 100%;
    display: block;
    cursor: pointer;
  }

  .play-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.35);
    transition: opacity 0.3s;
    pointer-events: none;
  }

  .play-overlay svg {
    width: 56px;
    height: 56px;
    fill: rgba(200,169,110,0.9);
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.6));
  }

  .video-wrap.playing .play-overlay {
    opacity: 0;
  }

  .video-info {
    padding: 0 0.25rem;
  }

  .video-info .label {
    font-size: 0.65rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 0.4rem;
  }

  .video-info .filename {
    font-size: 0.85rem;
    color: rgba(245,240,232,0.7);
    font-weight: 300;
    word-break: break-all;
  }

  .video-info .meta {
    font-size: 0.7rem;
    color: rgba(245,240,232,0.35);
    margin-top: 0.3rem;
    letter-spacing: 0.05em;
  }

  .controls {
    display: flex;
    gap: 0.75rem;
    margin-top: 0.5rem;
  }

  .btn {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 0.45rem 1rem;
    border: 1px solid rgba(200,169,110,0.4);
    background: transparent;
    color: var(--gold);
    cursor: pointer;
    font-family: 'Montserrat', sans-serif;
    transition: all 0.2s;
  }
  .btn:hover {
    background: rgba(200,169,110,0.1);
    border-color: var(--gold);
  }

  @media (max-width: 700px) {
    main { padding: 2rem; grid-template-columns: 1fr; gap: 3rem; }
    header { padding: 2rem; }
  }
</style>
</head>
<body>

<header>
  <a class="back" href="index.html">← Retour</a>
  <h1>Bibliothèque Vidéo</h1>
  <span class="count">7 vidéos</span>
</header>

<main id="grid"></main>

<script>
const videos = [
  {
    src: 'img/videos/78a9e26ace7b4160a614f82bf3b37297.mp4',
    label: 'Joaillier Privé — Révélation',
    note: 'Bague sur-mesure · 3.9 MB'
  },
  {
    src: 'img/videos/5dcc0929850b4fbea015c0e5b29ea8a4.mp4',
    label: 'Haute Joaillerie — Showcase',
    note: 'Collection principale · 40.6 MB'
  },
  {
    src: 'img/launch_video.mp4',
    label: 'Launch — Présentation',
    note: 'Événement lancement · 24.8 MB'
  },
  {
    src: 'img/video_a975.mp4',
    label: 'Vidéo A975',
    note: '24.8 MB'
  },
  {
    src: 'img/video_42f4.mp4',
    label: 'Vidéo 42F4',
    note: '36.6 MB'
  },
  {
    src: 'img/video_106f.mp4',
    label: 'Vidéo 106F',
    note: '12.1 MB'
  },
  {
    src: 'img/private_yellow_ring.mp4',
    label: 'Bague Yellow Ring',
    note: 'Produit · micro-vidéo'
  }
];

const grid = document.getElementById('grid');

videos.forEach((v, i) => {
  const card = document.createElement('div');
  card.className = 'video-card';

  const wrap = document.createElement('div');
  wrap.className = 'video-wrap';

  const vid = document.createElement('video');
  vid.src = v.src;
  vid.muted = true;
  vid.loop = true;
  vid.playsInline = true;
  vid.preload = 'metadata';

  const overlay = document.createElement('div');
  overlay.className = 'play-overlay';
  overlay.innerHTML = `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;

  wrap.appendChild(vid);
  wrap.appendChild(overlay);

  // Click to play/pause
  wrap.addEventListener('click', () => {
    if (vid.paused) {
      vid.play();
      wrap.classList.add('playing');
    } else {
      vid.pause();
      wrap.classList.remove('playing');
    }
  });

  vid.addEventListener('pause', () => wrap.classList.remove('playing'));
  vid.addEventListener('play', () => wrap.classList.add('playing'));

  const info = document.createElement('div');
  info.className = 'video-info';
  info.innerHTML = `
    <div class="label">${String(i+1).padStart(2,'0')} / Vidéo</div>
    <div class="filename">${v.label}</div>
    <div class="meta">${v.note} &nbsp;·&nbsp; ${v.src}</div>
    <div class="controls">
      <button class="btn" onclick="this.closest('.video-card').querySelector('video').play(); this.closest('.video-card').querySelector('.video-wrap').classList.add('playing')">▶ Play</button>
      <button class="btn" onclick="this.closest('.video-card').querySelector('video').pause(); this.closest('.video-card').querySelector('.video-wrap').classList.remove('playing')">⏸ Pause</button>
      <button class="btn" onclick="const v=this.closest('.video-card').querySelector('video'); v.currentTime=0; v.play(); this.closest('.video-card').querySelector('.video-wrap').classList.add('playing')">↺ Restart</button>
    </div>
  `;

  card.appendChild(wrap);
  card.appendChild(info);
  grid.appendChild(card);
});
</script>
</body>
</html>
